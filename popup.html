<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>LPL Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      background: #0f172a;
      color: #e2e8f0;
      font: 14px/1.5 system-ui, sans-serif;
      padding: 20px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(90deg, #818cf8, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    p { font-size: 12px; color: #64748b; line-height: 1.7; }
    .steps { margin-top: 14px; list-style: none; counter-reset: steps; }
    .steps li {
      counter-increment: steps;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      color: #94a3b8;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(steps);
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      background: #1e293b;
      color: #818cf8;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      display: block;
      margin-top: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font: 600 13px system-ui;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>◆ LPL Modern Dashboard</h1>
  <p>A modern UI overlay for LPL AccountView.</p>
  <ol class="steps">
    <li>Log in to accountview.lpl.com normally</li>
    <li>Click the <strong>◆ Enhanced View</strong> button in the bottom-right corner</li>
    <li>Navigate to Overview, Holdings, and Activity pages so data is captured</li>
    <li>Your dashboard updates automatically</li>
  </ol>
  <button class="btn" id="open-btn">Open AccountView</button>
  <script src="popup.js"></script>
</body>
</html>
